<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Mitaashi!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Pacifico&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pastel: {
                pink: '#FFD1DC',
                purple: '#E6E6FA',
                lime: '#D7F4D2',
                blue: '#D4F1F4',
                yellow: '#FDFD96'
              }
            },
            fontFamily: {
              hand: ['Pacifico', 'cursive'],
              script: ['Caveat', 'cursive'],
              body: ['Quicksand', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'flicker': 'flicker 0.1s infinite alternate',
              'pop': 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'fade-in': 'fadeIn 1s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              flicker: {
                '0%': { opacity: '1', transform: 'scale(1)' },
                '100%': { opacity: '0.8', transform: 'scale(0.9)' },
              },
              pop: {
                '0%': { transform: 'scale(0)' },
                '100%': { transform: 'scale(1)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFD1DC; /* Fallback */
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fff0f5; 
      }
      ::-webkit-scrollbar-thumb {
        background: #ffb7c5; 
        border-radius: 4px;
      }
    </style>
  <script type="importmap">

    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>

</head>

    <div id="root"></div>

</body>
</html>
